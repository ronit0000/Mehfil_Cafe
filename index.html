<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mehfil Rooftop Cafe & Restro – A premium dining destination in Berhampur, Odisha. Experience the finest cuisine under the open sky." />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Mehfil Rooftop Cafe & Restro | Berhampur, Odisha</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Prevent FOUC / layout shifts */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body { background: #0A0A0A; color: #F5EDD6; overflow-x: hidden; }
      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #111; }
      ::-webkit-scrollbar-thumb { background: #D4A843; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #E8782A; }
      /* Selection */
      ::selection { background: rgba(212,168,67,0.3); color: #F5EDD6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
